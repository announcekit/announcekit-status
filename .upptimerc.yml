owner: announcekit
repo: announcekit-status

sites:
  - name: Website
    url: https://announcekit.app
  - name: Dashboard
    url: https://announcekit.app/dashboard
  - name: API
    url: https://announcekit.app/gq/v2
    method: POST
    headers:
      - "Content-Type: application/json"
    body: '{"query":"{__typename}"}'
  - name: Widget CDN
    url: https://cdn.announcekit.app/widget-v2.js
  - name: Changelog Pages
    url: https://changelog.announcekit.app
  - name: Image CDN
    url: https://img.announcekit.app/c10f62bbae1530a45a4feb09fb514cc7?w=100&s=1af07b4643b45671e954007410a8847d
  - name: MCP Server
    url: https://mcp.announcekit.app/health

status-website:
  # Trial: served at https://announcekit.github.io/announcekit-status
  # Cutover: remove baseUrl, uncomment cname, point the status DNS record (CNAME) to announcekit.github.io
  baseUrl: /announcekit-status
  # cname: status.announcekit.app
  name: AnnounceKit Status
  introTitle: "AnnounceKit system status"
  introMessage: Live status of AnnounceKit services, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: AnnounceKit
      href: https://announcekit.app
